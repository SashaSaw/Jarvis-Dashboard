<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=20260327b">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐶</text></svg>">
</head>
<body>
  <div class="app-shell">
    <!-- Mobile Top Bar -->
    <div class="mobile-topbar" id="mobile-topbar">
      <button class="hamburger-btn" id="hamburger-btn" onclick="toggleSidebar()" aria-label="Open menu">☰</button>
      <span class="mobile-topbar-title">🐶 Jarvis</span>
      <span class="mobile-topbar-page" id="mobile-topbar-page">Overview</span>
    </div>
    <!-- Sidebar Backdrop -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-logo">🐶</span>
        <span class="sidebar-title">Jarvis</span>
      </div>

      <!-- Agent Status Cards -->
      <div class="sidebar-agents">
        <div class="sidebar-agent" id="sidebar-agent-jarvis">
          <span class="agent-dot" id="agent-dot-jarvis"></span>
          <span class="agent-icon">🐶</span>
          <div class="agent-info">
            <span class="agent-name">Jarvis</span>
            <span class="agent-status-text" id="agent-status-jarvis">Loading...</span>
          </div>
        </div>
        <div class="sidebar-agent" id="sidebar-agent-klaus">
          <span class="agent-dot" id="agent-dot-klaus"></span>
          <span class="agent-icon">⚡</span>
          <div class="agent-info">
            <span class="agent-name">Klaus</span>
            <span class="agent-status-text" id="agent-status-klaus">Loading...</span>
          </div>
        </div>
        <div class="sidebar-agent" id="sidebar-agent-emily">
          <span class="agent-dot" id="agent-dot-emily"></span>
          <span class="agent-icon">📧</span>
          <div class="agent-info">
            <span class="agent-name">Emily</span>
            <span class="agent-status-text" id="agent-status-emily">Loading...</span>
          </div>
        </div>
      </div>

      <div class="sidebar-divider"></div>

      <!-- Navigation -->
      <nav class="sidebar-nav">
        <a class="nav-link" href="#home" data-view="home">
          <span class="nav-icon">🏠</span> Home
        </a>
        <a class="nav-link" href="#schedule" data-view="schedule">
          <span class="nav-icon">🗓️</span> Schedule
        </a>
        <a class="nav-link" href="#inbox" data-view="inbox">
          <span class="nav-icon">📥</span> Inbox
        </a>
        <a class="nav-link" href="#kanban" data-view="kanban">
          <span class="nav-icon">📋</span> Kanban
        </a>
        <a class="nav-link" href="#projects" data-view="projects">
          <span class="nav-icon">📁</span> Projects
        </a>
        <a class="nav-link" href="#ideas" data-view="ideas">
          <span class="nav-icon">💡</span> Ideas
        </a>
        <a class="nav-link" href="#workspace" data-view="workspace">
          <span class="nav-icon">🗂️</span> Workspace
        </a>
        <a class="nav-link" href="#docs" data-view="docs">
          <span class="nav-icon">📝</span> Docs
        </a>
        <a class="nav-link" href="#finance" data-view="finance">
          <span class="nav-icon">💰</span> Finance
        </a>
        <a class="nav-link" href="#log" data-view="log">
          <span class="nav-icon">📜</span> Log
        </a>
      </nav>

      <div class="sidebar-footer">
        <span class="sidebar-updated">Updated: <span id="last-update">--</span></span>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <div class="loading"><div class="spinner"></div> Loading...</div>
    </main>
  </div>

  <!-- Card Detail Modal (Trello) -->
  <div class="modal-overlay" id="card-modal" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="modal-card-name"></h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label>Description <button class="btn-edit-desc" id="btn-edit-desc" onclick="toggleDescEdit()">✏️ Edit</button></label>
          <p id="modal-card-desc" class="modal-desc"></p>
          <div id="modal-desc-edit" style="display:none;">
            <textarea id="modal-desc-textarea" class="modal-textarea" rows="4"></textarea>
            <div class="desc-edit-actions">
              <button class="btn-save-desc" onclick="saveDesc()">Save</button>
              <button class="btn-cancel-desc" onclick="cancelDescEdit()">Cancel</button>
            </div>
          </div>
        </div>
        <div class="modal-field">
          <label>List</label>
          <div class="list-move-row">
            <button class="btn-move-arrow" id="btn-move-left" onclick="moveCardLeft()" title="Move to previous list">◀</button>
            <select id="modal-card-list" class="modal-select"></select>
            <button class="btn-move-arrow" id="btn-move-right" onclick="moveCardRight()" title="Move to next list">▶</button>
          </div>
        </div>
        <div class="modal-field" id="modal-labels-field">
          <label>Labels</label>
          <div id="modal-card-labels"></div>
          <div id="modal-label-picker" class="label-picker"></div>
        </div>
        <div class="modal-field" id="modal-due-field">
          <label>Due</label>
          <span id="modal-card-due"></span>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-move" id="modal-move-btn" onclick="moveCurrentCard()">Move Card</button>
        <button class="btn-archive" onclick="archiveCurrentCard()">Archive</button>
      </div>
    </div>
  </div>

  <!-- New Card Modal (Trello) -->
  <div class="modal-overlay" id="new-card-modal" onclick="closeNewCardModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>New Card</h3>
        <button class="modal-close" onclick="closeNewCardModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label>Title</label>
          <input type="text" id="new-card-name" class="modal-input" placeholder="Card title..." autofocus>
        </div>
        <div class="modal-field">
          <label>Description</label>
          <textarea id="new-card-desc" class="modal-textarea" placeholder="Optional description..."></textarea>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-move" onclick="submitNewCard()">Create Card</button>
        <button class="btn-archive" onclick="closeNewCardModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Task Detail Modal -->
  <div class="modal-overlay" id="task-modal" onclick="closeTaskModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="task-modal-title">Edit Task</h3>
        <button class="modal-close" onclick="closeTaskModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label>Title</label>
          <input type="text" id="task-modal-name" class="modal-input">
        </div>
        <div class="modal-field">
          <label>Description</label>
          <textarea id="task-modal-desc" class="modal-textarea" rows="3" placeholder="Add details..."></textarea>
        </div>
        <div class="modal-field">
          <label>Priority</label>
          <select id="task-modal-priority" class="modal-select">
            <option value="low">🔘 Low</option>
            <option value="normal" selected>🔵 Normal</option>
            <option value="high">🟠 High</option>
            <option value="urgent">🔴 Urgent</option>
          </select>
        </div>
        <div class="modal-field">
          <label>Category</label>
          <input type="text" id="task-modal-category" class="modal-input" placeholder="e.g. work, personal, project...">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-move" onclick="saveTaskModal()">Save</button>
        <button class="btn-archive" onclick="closeTaskModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Schedule Entry Modal -->
  <div class="modal-overlay" id="schedule-modal" onclick="closeScheduleModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3 id="schedule-modal-title">New Schedule Entry</h3>
        <button class="modal-close" onclick="closeScheduleModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-field">
          <label>Title</label>
          <input type="text" id="schedule-title" class="modal-input" placeholder="Event title..." autofocus>
        </div>
        <div class="modal-field">
          <label>Date</label>
          <input type="date" id="schedule-date" class="modal-input">
        </div>
        <div class="modal-field" style="display:flex;gap:0.75rem;">
          <div style="flex:1">
            <label>Start Time</label>
            <input type="time" id="schedule-start" class="modal-input">
          </div>
          <div style="flex:1">
            <label>End Time</label>
            <input type="time" id="schedule-end" class="modal-input">
          </div>
        </div>
        <div class="modal-field">
          <label>Color</label>
          <div class="schedule-color-picker" id="schedule-color-picker"></div>
        </div>
        <div class="modal-field">
          <label>Description</label>
          <textarea id="schedule-desc" class="modal-textarea" rows="2" placeholder="Optional description..."></textarea>
        </div>
        <div class="modal-field">
          <label>Link to Task (optional)</label>
          <select id="schedule-task-link" class="modal-select">
            <option value="">— No task —</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-move" id="schedule-save-btn" onclick="saveScheduleEntry()">Save</button>
        <button class="btn-archive" id="schedule-delete-btn" onclick="deleteScheduleEntry()" style="display:none">🗑 Delete</button>
        <button class="btn-archive" onclick="closeScheduleModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/app.js?v=20260327b"></script>
</body>
</html>
